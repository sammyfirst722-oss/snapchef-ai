<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — SnapChef AI</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #052e16;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background-color: #064e3b;
      border: 2px solid #10b981;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 380px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      margin: 16px 0 8px 0;
      color: #34d399;
    }
    p {
      color: #a7f3d0;
      font-size: 15px;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    button {
      background-color: #10b981;
      color: #052e16;
      font-weight: 700;
      font-size: 15px;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
    }
    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 48px;">🍳</div>
    <h1>You're Offline</h1>
    <p>SnapChef AI needs an internet connection to scan your fridge and generate smart recipes.</p>
    <button onclick="window.location.reload()">Try Reconnecting</button>
  </div>
</body>
</html>
