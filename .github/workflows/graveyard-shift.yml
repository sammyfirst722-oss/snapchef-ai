name: Graveyard Shift - 24/7 Cloud Uptime & Health Monitor

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC) completely in the cloud
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  uptime-and-health:
    name: 24/7 Cloud Site Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Ping Production Health Endpoint
        run: |
          echo "Checking SnapChef AI Production Health..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://snapchef-ai-eight.vercel.app/api/health)
          echo "Health Endpoint HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::SnapChef AI health endpoint returned $HTTP_STATUS instead of 200!"
            exit 1
          fi
          echo "SnapChef AI is 100% operational!"

      - name: Verify IndexNow Verification Key Live
        run: |
          KEY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://snapchef-ai-eight.vercel.app/e4f5a892b1044cbcae7832dbfa961e05.txt)
          echo "IndexNow Key HTTP Status: $KEY_STATUS"
          if [ "$KEY_STATUS" -ne 200 ]; then
            echo "::warning::IndexNow verification key returned $KEY_STATUS"
          fi
